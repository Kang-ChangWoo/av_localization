# ZInD (Zillow Indoor Dataset) monocular structural depth.
# Same shape as s3d_mono_lr3e4.yaml -- zind is the other L = 0 collection, so
# mono is the only trainable net (mv/comp need L + 1 views per chunk).
# F_W = 0.375 matches the dataset K = [[240,0,320],[0,240,240],[0,0,1]]
# (dataset_meta.json camera.F_W), unlike s3d 0.5959.
data:
  root: /root/storage/echoloc_dataset/zind
  datasets:
  - zind
  L: 0
  views: ref
  batch_size: 24
  num_workers: 8
  prefetch_factor: 2
  add_rp: false
  roll: 0.0
  pitch: 0.0
model:
  lr: 0.0003
  shape_loss_weight: 1.0
  d_min: 0.1
  d_max: 15.0
  d_hyp: -0.2
  D: 128
  F_W: 0.375
  warmup_steps: 200
train:
  gpus: "0"
  epochs: 30
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 20
  matmul_precision: high
  seed: 0
  run_name: zind/mono_lr3e4
  output_dir: outputs/visual
