# Multi-view structural depth network (paper: "Ours_m").
#
# d_hyp is -0.2 rather than the mv_depth_net_pl constructor default of 1.0:
# upstream's eval_observation.py builds the multi-view net with d_hyp=-0.2, so
# training has to match the depth-hypothesis spacing used at inference.

data:
  # staged copy: the shared dataset export is not reliably fast enough
  # for multi-GPU training. scripts/stage_f3loc_dataset.py refreshes this.
  root: /root/storage/implementation/shared_audio/av_localization/av_localization/data/f3loc
  datasets: [gibson_f, gibson_g]
  L: 3
  batch_size: 12          # per GPU
  num_workers: 4          # per GPU (a 4-view sample is ~15 MB, so keep the pool small)
  prefetch_factor: 2
  add_rp: false
  roll: 0.0
  pitch: 0.0

model:
  lr: 3.0e-4
  shape_loss_weight: null # paper: L1 only, the shape term is monocular-specific
  d_min: 0.1
  d_max: 15.0
  d_hyp: -0.2
  D: 128
  F_W: 0.375
  warmup_steps: 500

train:
  gpus: "1,2,3,4"
  epochs: 30
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  matmul_precision: high
  seed: 0
  run_name: mv
  output_dir: outputs
